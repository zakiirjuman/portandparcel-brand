<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Port & Parcel Brand Assets</title>
    <style>
      body { font-family: system-ui, sans-serif; padding: 32px; }
      .row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
      .card { border: 1px solid #ddd; border-radius: 12px; padding: 16px; }
      img { max-width: 260px; height: auto; display: block; }
    </style>
  </head>
  <body>
    <h1>Port & Parcel — Brand Assets</h1>

    <div class="row">
      <div class="card">
        <h3>SVG</h3>
        <img src="assets/portandparcel-logo.svg" alt="Port & Parcel logo (SVG)" />
        <p><a href="assets/portandparcel-logo.svg">Download SVG</a></p>
      </div>

      <div class="card">
        <h3>PNG</h3>
        <img src="assets/portandparcel-logo@1x.png" alt="Port & Parcel logo (PNG)" />
        <p><a href="assets/portandparcel-logo@1x.png">Download PNG</a></p>
      </div>
    </div>
  </body>
</html>
